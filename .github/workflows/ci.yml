name: CI

# Build, vet and test on every pull request, and on main so a bad merge shows up
# immediately rather than surprising the next person to open a PR.
on:
  pull_request:
  push:
    branches: [main]

# Read-only: nothing here publishes anything. A token that cannot write is one
# that cannot be misused by a compromised dependency.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A single checkout is enough now. This job used to clone two siblings:
      # NimoOS-Common, because go.mod redirected the module to
      # ../NimoOS-Common, and NimoOS-MessageBus, because codegen/ was
      # gitignored and had to be regenerated from that repository's OpenAPI
      # spec. Both needed a token, because both were private.
      #
      # NimoOS-Common is an ordinary published module now, and codegen/ is
      # committed, so neither sibling is needed to build — which also means
      # this job builds the same way an outside contributor's clone does.
      - name: Check out NimoOS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Take the toolchain from go.mod so this workflow cannot drift from what
      # the module actually declares.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # codegen/ is committed, so the build no longer depends on generating it
      # first. This step catches the opposite problem: generated code that no
      # longer matches the spec it came from, because someone edited
      # api/nimoos/openapi.yaml without regenerating, or edited the generated
      # file by hand.
      #
      # -run selects only the directive that reads this repository's own spec.
      # The other one reads ../NimoOS-MessageBus/api/message_bus/openapi.yaml,
      # which is not checked out here — deliberately. Regenerating the
      # message-bus client against whatever is on that repository's main would
      # turn a change over there into a red build here, on a PR that touched
      # nothing related. That client is updated on purpose, in its own commit.
      - name: Check the generated API code is current
        run: |
          go generate -run 'api/nimoos/openapi.yaml' ./...
          if ! git diff --exit-code -- codegen/; then
            echo "::error::codegen/ is out of date. Run 'go generate ./...' and commit the result."
            exit 1
          fi

      # CGO_ENABLED=1 matches NimoOS-Build/scripts/deploy.sh, which is what
      # builds the shipped binary. This service also compiles with
      # CGO_ENABLED=0 — go-sqlite3 has a no-cgo stub — but that binary panics
      # the moment it touches the database, so building any other way would
      # make a green run meaningless.
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      # Skipped for a stated reason, so that a red run always means something is
      # genuinely broken.
      #
      # TestValidateFileUploadMetadataForRootUsesResolvedRoot asserts the
      # no-matching-mount fallback, which statfs()es /DATA for real — the test's
      # own comment calls that out as deliberate. /DATA exists on an installed
      # NimoOS and not on a runner, so the syscall returns ENOENT and the test
      # fails everywhere else. Making the fallback root injectable, the way
      # mountsFn already is, would let it run anywhere; until then it is skipped.
      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -skip '^(TestValidateFileUploadMetadataForRootUsesResolvedRoot)$' ./...
