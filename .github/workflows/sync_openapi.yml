# DISABLED: This workflow syncs OpenAPI specs using IceWhaleTech's private GitHub token.
# Kept for reference. To re-enable, configure API_TOKEN_GITHUB secret and update project-name.
name: Sync OpenAPI

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
  push:
    branches:
      - main

jobs:
  sync:
    if: false
    uses: IceWhaleTech/github/.github/workflows/sync_openapi.yml@main
    with:
      project-name: casaos
    secrets:
      API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
